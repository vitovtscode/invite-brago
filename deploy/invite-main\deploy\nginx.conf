# Brago invitation: put inside your server { ... } block.
# Every visit downloads a fresh copy: no browser or proxy caching.

location / {
    index priglashenie.html;
    try_files $uri $uri/ =404;

    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    etag off;
    if_modified_since off;
}

# Calendar file must be served as text/calendar so phones open "Add event"
location ~* \.ics$ {
    default_type text/calendar;
    types { text/calendar ics; }
    add_header Content-Disposition 'inline; filename="brago-opening.ics"' always;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
}

# Video: allow seeking / streaming (range requests are on by default in nginx)
location ~* \.mp4$ {
    types { video/mp4 mp4; }
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
}
